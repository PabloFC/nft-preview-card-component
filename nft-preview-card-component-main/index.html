<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="PabloFC" />
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img src="./images/image-equilibrium.jpg" alt="cubed photo" />
        <div class="card-body">
          <div class="title">
            <h1>Equilibrium #3429</h1>
          </div>
          <div class="subtitle">
            <p>Our Equilibrium collection promotes balance and calm</p>
          </div>
          <div class="info">
            <div class="subinfo">
              <img class="svg" src="images/icon-ethereum.svg" alt="" />
              <p class="subinfo-paragraph">0.041ETM</p>
            </div>
            <div class="subinfo">
              <img class="svg" src="images/icon-clock.svg" alt="" />
              <p>3 days left</p>
            </div>
          </div>
          <hr />
          <div class="author">
            <img class="avatar" src="./images/image-avatar.png" alt="avatar" />
            <p>Creation of <span>PabloFC</span></p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
